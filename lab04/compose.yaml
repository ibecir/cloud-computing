name: lab04

services:
  app:
    build: .
    image: lab04-app:1.0
    environment:
      OWNER: ibecir
      DATABASE_URL: postgresql://lab:lab@db:5432/lab
    deploy:
      replicas: 2
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 2s
      timeout: 3s
      retries: 15

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
